{% set name = "membrane-curvature" %}
{% set version = "2.0.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/membrane_curvature-{{ version }}.tar.gz
  sha256: 94bf0a230bbace87303ee0a41eeaf658558f0ec92ea3b7b1e19c6375784bd445

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - mdanalysis >=2.0.0

test:
  imports:
    - membrane_curvature
  commands:
    - pip check
    - pytest
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  source_files:
    - membrane_curvature/tests

about:
  home: https://github.com/MDAnalysis/membrane-curvature
  summary: MDAnalysis tool to calculate membrane curvature from MD simulations.
  license: GPL-3.0-only
  license_file: LICENSE
  doc_url: https://membrane-curvature.readthedocs.io/
  dev_url: https://github.com/MDAnalysis/membrane-curvature

extra:
  recipe-maintainers:
    - ojeda-e
